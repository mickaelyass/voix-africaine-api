version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    # ⚠️ Aucun secret en dur ici.
    # En local : les valeurs viennent du fichier .env (chargé via env_file).
    # En production (Render, etc.) : renseigner les variables d'environnement
    # directement dans le dashboard — aucun fichier .env n'est envoyé.
    env_file:
      - .env
    environment:
      - MONGO_DB_NAME=${MONGO_DB_NAME:-voix_africaine}

